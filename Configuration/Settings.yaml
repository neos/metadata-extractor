Neos:
  MetaData:
    Extractor:
      realtimeExtraction:
        enabled: true

    metaDataProperties:
      # Properties filled from the EXIF / IPTC data of an asset.
      # Values are stored as strings; array-valued tags are stored as their JSON representation, dates as
      # an ISO date string ('Y-m-d H:i:s').
      'exif.ApertureValue': &propertyConfig
        type: string
        globalScope: true
        ui:
          label: i18n
          inspector:
            editorOptions:
              readonly: true
      'exif.Artist': *propertyConfig
      'exif.BodySerialNumber': *propertyConfig
      'exif.CameraOwnerName': *propertyConfig
      'exif.ColorSpace': *propertyConfig
